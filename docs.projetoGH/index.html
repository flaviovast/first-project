<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Repositórios GitHub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <div class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" role="img"><path fill="currentColor" d="M12 .5a12 12 0 0 0-3.79 23.39c.6.11.82-.26.82-.58v-2.04c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.75.08-.74.08-.74 1.2.08 1.83 1.24 1.83 1.24 1.07 1.83 2.8 1.3 3.48.99.11-.77.42-1.3.76-1.6-2.67-.3-5.47-1.34-5.47-5.95 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.17 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.29-1.55 3.3-1.23 3.3-1.23.66 1.65.24 2.87.12 3.17.77.84 1.24 1.91 1.24 3.22 0 4.62-2.81 5.64-5.49 5.94.43.37.81 1.1.81 2.22v3.29c0 .32.22.69.83.57A12 12 0 0 0 12 .5Z"/></svg>
            </div>
            <div>
                <p class="eyebrow">Explore open source</p>
                <h1>Buscador de Repositórios</h1>
            </div>
        </header>
        
        <div class="search-card">
            <label class="search-label" for="searchInput">Pesquisar no GitHub</label>
            <div class="search-field">
                <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m2.1-5.4a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z"/></svg>
                <input type="text" id="searchInput" placeholder="ex.: javascript, machine learning..." class="search-input">
                <span class="search-key">ENTER</span>
            </div>
        </div>

        <!-- Results Container -->
        <div id="resultsContainer" class="results-container hidden">
            <!-- Loading State -->
            <div id="loadingState" class="state-message loading hidden">
                <p>Carregando resultados...</p>
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="state-message empty hidden">
                <p>Nenhum repositório encontrado. Tente outro termo de busca.</p>
            </div>

            <!-- Error State -->
            <div id="errorState" class="state-message error hidden">
                <p id="errorMessage">Ocorreu um erro ao buscar repositórios. Tente novamente.</p>
            </div>

            <!-- Results List -->
            <div id="resultsList" class="results-card hidden">
                <!-- Results will be inserted here by JavaScript -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
